<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Sandbox-only: invert RGB exactly, retaining original geometry and alpha. -->
  <defs><filter id="invert" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="table" tableValues="1 0"/>
      <feFuncG type="table" tableValues="1 0"/>
      <feFuncB type="table" tableValues="1 0"/>
      <feFuncA type="identity"/>
    </feComponentTransfer>
  </filter></defs>
  <image width="32" height="32" filter="url(#invert)" href="data:image/png;base64,"/>
</svg>
