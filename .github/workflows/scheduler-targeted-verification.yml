name: Scheduler targeted verification
on:
  push:
    branches: [sandbox/scheduler-targeted-linux-verification]
    paths: [.github/workflows/scheduler-targeted-verification.yml]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5620d267020de9a31b3325e81947f18df08c48de
          persist-credentials: false
      - name: Record exact snapshot
        run: |
          mkdir -p ci-evidence
          test "$(git rev-parse HEAD)" = "5620d267020de9a31b3325e81947f18df08c48de"
          git rev-parse HEAD > ci-evidence/tested-sha.txt
          sha256sum validation/sandbox_prozorro_fixture.py validation/sandbox_scheduler_smoke.py > ci-evidence/fixture-hashes.txt
          echo '47de3d53657a6e397405950e79cce3f07c37eeb57499bc56e4511e27eaf74c78  validation/sandbox_prozorro_fixture.py' | sha256sum --check
          echo '5aa3ec0a3314e28fa3d3b35f696e71c0d39573601b9f68e2716c1858e64e61f0  validation/sandbox_scheduler_smoke.py' | sha256sum --check
      - name: Build isolated test image
        run: |
          set -euo pipefail
          docker build --tag pqm-scheduler-targeted:tested . 2>&1 | tee ci-evidence/build.log
          docker image inspect pqm-scheduler-targeted:tested --format '{{.Id}}' > ci-evidence/image-id.txt
      - name: Run targeted synthetic scheduler test
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python \
            -e PYTHONPATH=/app/validation:/app pqm-scheduler-targeted:tested \
            -B -m unittest -v sandbox_scheduler_smoke.AutomaticHTTP.test_automatic_start_schedule_restart_and_orphan_recovery \
            2>&1 | tee ci-evidence/targeted.log
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduler-targeted-${{ github.run_id }}
          path: ci-evidence/
