          git('merge-base','--is-ancestor',base,'HEAD')
          assert not git('status','--porcelain'), 'STOP: dirty checkout'
          git('diff','--check',base,'HEAD')
          changed = set(git('diff','--name-only','-z',base,'HEAD').decode('utf-8', errors='strict').strip('\0').split('\0'))
          assert changed == set(expected) and len(changed)==91, 'STOP: scope'
          for name,digest in expected.items():
