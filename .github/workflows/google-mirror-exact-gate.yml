      - name: Build and run isolated full writer producer and existing regressions
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner\texit_code\tlog_exit_code\n' > ci-evidence/runner-exit-codes.tsv
          failed=0
          run_check() {
            local label="$1"
            shift
            set +e
            "$@" 2>&1 | tee "ci-evidence/$label.log"
            local -a codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\t%s\t%s\n' "$label" "${codes[0]}" "${codes[1]}" >> ci-evidence/runner-exit-codes.tsv
            if [[ "${codes[0]}" != 0 || "${codes[1]}" != 0 ]]; then failed=1; fi
          }
          run_check build docker build --tag pqm-mirror-gate:tested .
          test "$failed" -eq 0
          docker image inspect pqm-mirror-gate:tested --format '{{.Id}}' > ci-evidence/image-id.txt
          mapfile -t writer_tests < <(find scripts/pqm-google-writer -name '*.test.cjs' -type f | sort)
          test "${#writer_tests[@]}" -gt 0
          run_check writer docker run --rm --network none --entrypoint node -e PQM_PYTHON=python3 pqm-mirror-gate:tested --test "${writer_tests[@]}"
          run_check targeted docker run --rm --network none --entrypoint python -e PYTHONPATH=/app/validation/test_runtime:/app -e PQM_TEST_NETWORK_ISOLATION=1 -e PQM_ENV=local -e PQM_RELEASE_SCHEMA_ONLY=1 -e PQM_ENABLE_SCHEDULER=0 -e PQM_ENABLE_GOOGLE=0 pqm-mirror-gate:tested -B -m unittest validation.local_release_20260911.test_edr_sync_v2 validation.local_release_20260911.test_supplier_registry_integration test_google_verification_contract test_google_alignment_backend test_google_writer_execution test_google_read_model_acceptance test_google_status_event_producer validation.local_release_20260911.test_supplier_edr_dates validation.local_release_20260911.test_single_supplier_edr_workflow validation.local_release_20260911.test_permanent_edr_sync_safety -v
          run_check scheduler-admin docker run --rm --network none --entrypoint python -e PYTHONPATH=/app/validation/test_runtime:/app -e PQM_TEST_NETWORK_ISOLATION=1 -e PQM_ENV=local -e PQM_RELEASE_SCHEMA_ONLY=1 -e PQM_ENABLE_SCHEDULER=0 -e PQM_ENABLE_GOOGLE=0 pqm-mirror-gate:tested -B -m unittest test_google_sandbox_baseline_compatibility validation.local_release_20260911.test_scheduler_admin validation.local_release_20260911.test_scheduler_runtime validation.local_release_20260911.test_sandbox_scheduler_controls validation.local_release_20260911.test_sandbox_canonical_officer -v
          run_check producer docker run --rm --network none --entrypoint python -e PYTHONPATH=/app/validation/test_runtime:/app -e PQM_TEST_NETWORK_ISOLATION=1 -e PQM_ENV=local -e PQM_RELEASE_SCHEMA_ONLY=1 -e PQM_ENABLE_SCHEDULER=0 -e PQM_ENABLE_GOOGLE=0 pqm-mirror-gate:tested -B -m unittest test_google_status_event_producer -v
          run_check container-gate docker run --rm --network none --entrypoint python pqm-mirror-gate:tested -B validation/docker_release_gate.py
          run_check amcu docker run --rm --network none --entrypoint node pqm-mirror-gate:tested validation/amcu_poll_smoke.cjs
          run_check contrast docker run --rm --network none --entrypoint node pqm-mirror-gate:tested validation/sandbox_contrast_smoke.cjs
          run_check oauth docker run --rm --network none --entrypoint python -e PYTHONPATH=/app/validation/test_runtime:/app -e PQM_TEST_NETWORK_ISOLATION=1 -e PQM_ENV=local -e HOST=127.0.0.1 -e PORT=8080 -e PQM_AUTH_ENABLED=0 -e PQM_ENABLE_SCHEDULER=0 pqm-mirror-gate:tested -B -m unittest test_google_oauth_hotfix -v
          run_check full-regression docker run --rm --network none --entrypoint python -e PYTHONPATH=/app/validation/test_runtime:/app pqm-mirror-gate:tested -B validation/run_local_release.py
          if [[ "$failed" == 0 ]]; then printf 'PASS\n' > ci-evidence/gate-result.txt; else printf 'FAIL\n' > ci-evidence/gate-result.txt; fi
          test "$failed" -eq 0
      - name: Save SHA hashes exit codes and full logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: google-mirror-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error
