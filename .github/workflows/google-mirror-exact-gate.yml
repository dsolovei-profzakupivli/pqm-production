          def functions(raw):
              return {n.name:ast.dump(n,include_attributes=False) for n in ast.parse(raw.decode('utf-8-sig')).body if isinstance(n,ast.FunctionDef)}
          before,after=functions(git('show',base+':server.py')),functions(git('show','HEAD:server.py'))
