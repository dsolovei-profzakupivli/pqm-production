name: PQM release checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pqm-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-gate:
    name: Container release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record tested revision
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD > ci-evidence/tested-sha.txt
          printf 'PR checks test the merge revision; promotion requires the final deployed SHA.\n' > ci-evidence/scope.txt
      - name: Setup Node.js for browser regressions
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Set up isolated Python environment for historical checks
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pqm-release-python"
          "$RUNNER_TEMP/pqm-release-python/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Apps Script legacy reconciliation evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/pqm-google-writer/mirror-alignment/sandbox/partial-reconciliation.test.cjs \
            scripts/pqm-google-writer/mirror-alignment/sandbox/legacy-reconciliation-evidence-v2.test.cjs \
            validation/google_writer_apply_result_ui.test.cjs \
            validation/google_writer_continuation_preview_ui.test.cjs \
            validation/queue_statistics_ui.test.cjs
          snapshot="$RUNNER_TEMP/pqm-append-continuation-history-7417591"
          mkdir -p "$snapshot/validation/local_release_20261113"
          git archive 7417591bbd8cb945a85e759d28036b72f97f8e9e | tar -x -C "$snapshot"
          for suffix in v2 v3; do
            cp "validation/local_release_20261113/google_writer_append_continuation_${suffix}.json" "$snapshot/validation/local_release_20261113/"
            cp "test_google_writer_append_continuation_integrity_${suffix}.py" "$snapshot/"
          done
          (cd "$snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_append_continuation_integrity_v2 \
            test_google_writer_append_continuation_integrity_v3)
          v4_snapshot="$RUNNER_TEMP/pqm-append-continuation-v4-ce722e3"
          mkdir -p "$v4_snapshot"
          git archive ce722e3ed654a0e30be3b048a292e1e7e6ba0828 | tar -x -C "$v4_snapshot"
          (cd "$v4_snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_append_continuation_integrity_v4)
          v5_snapshot="$RUNNER_TEMP/pqm-apply-result-v5-2a4e4bf"
          mkdir -p "$v5_snapshot"
          git archive 2a4e4bff0bbbe84670d3bb10a5ba4b90347a7d78 | tar -x -C "$v5_snapshot"
          (cd "$v5_snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_apply_result_integrity_v5)
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_c246_historical_integrity_snapshots_v1.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_google_writer_historical_integrity_snapshots_v1.py
          v6_snapshot="$RUNNER_TEMP/pqm-apply-result-v6-86b6ad8"
          mkdir -p "$v6_snapshot"
          git archive 86b6ad82105fdcd7fa530a872943525af812ec47 | tar -x -C "$v6_snapshot"
          (cd "$v6_snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_apply_result_integrity_v6)
          v7_snapshot="$RUNNER_TEMP/pqm-apply-result-v7-8bf5fb"
          mkdir -p "$v7_snapshot"
          git archive 8bf5fb0188bebf6f2b35583ec018848c914b714c | tar -x -C "$v7_snapshot"
          (cd "$v7_snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_apply_result_integrity_v7)
          v8_snapshot="$RUNNER_TEMP/pqm-apply-result-v8-926ae60"
          mkdir -p "$v8_snapshot"
          git archive 926ae60ff3412a9c236c903b70623881459d871c | tar -x -C "$v8_snapshot"
          (cd "$v8_snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_apply_result_integrity_v8)
          v9_snapshot="$RUNNER_TEMP/pqm-apply-result-v9-b988f14"
          mkdir -p "$v9_snapshot"
          git archive b988f140af37c45bd5461735cf40d18cd00d741a | tar -x -C "$v9_snapshot"
          (cd "$v9_snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_apply_result_integrity_v9)
          writer_v5_v10_snapshot="$RUNNER_TEMP/pqm-writer-v5-v10-9b38a25"
          mkdir -p "$writer_v5_v10_snapshot"
          git archive 9b38a258c0d279f33541dac6e95d12d3057a9b70 | tar -x -C "$writer_v5_v10_snapshot"
          (cd "$writer_v5_v10_snapshot" && "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_append_continuation_integrity_v5 \
            test_google_writer_apply_result_integrity_v10)
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v1_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v2_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v3_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v4_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v5_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v6_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v7_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v8_history.py
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v9_history.py
          PQM_INTEGRATED_V10_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v10-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v10_history.py
          echo "PQM_INTEGRATED_V10_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v10-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V11_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v11-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v11_history.py
          echo "PQM_INTEGRATED_V11_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v11-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V12_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v12-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v12_history.py
          echo "PQM_INTEGRATED_V12_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v12-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V13_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v13-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v13_history.py
          echo "PQM_INTEGRATED_V13_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v13-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V14_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v14-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v14_history.py
          echo "PQM_INTEGRATED_V14_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v14-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V15_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v15-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v15_history.py
          echo "PQM_INTEGRATED_V15_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v15-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V16_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v16-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v16_history.py
          echo "PQM_INTEGRATED_V16_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v16-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V17_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v17-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v17_history.py
          echo "PQM_INTEGRATED_V17_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v17-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          PQM_INTEGRATED_V18_SNAPSHOT_ARCHIVE_OUT="$RUNNER_TEMP/pqm-integrated-v18-snapshot.zip" \
            "$RUNNER_TEMP/pqm-release-python/bin/python" -B validation/run_integrated_writer_ui_v18_history.py
          echo "PQM_INTEGRATED_V18_SNAPSHOT_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pqm-integrated-v18-snapshot.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          # Immutable integrated v1-v18 checks ran on their pinned snapshots above;
          # only the current integrated overlay v19 runs against this checkout.
          "$RUNNER_TEMP/pqm-release-python/bin/python" -B -m unittest -v \
            test_google_writer_integrated_candidate_integrity_v19 \
            validation.local_release_20260911.test_release_test_package \
            validation.local_release_20260911.test_integrated_snapshot_staging \
            validation.local_release_20260911.test_uo_work_queue_http \
            test_google_writer_update_append_v2_integrity \
            test_google_writer_update_append_v3_integrity \
            validation.local_release_20260911.test_edr_sync_v2 \
            validation.local_release_20260911.test_permanent_edr_sync_safety \
            validation.local_release_20260911.test_sandbox_edr_review \
            test_google_writer_saved_continuation_audit \
            test_release_gate_infrastructure.ReleaseGateInfrastructureTests.test_workflow_routes_historical_and_current_integrity_checks \
            test_release_gate_infrastructure.ReleaseGateInfrastructureTests.test_container_release_gate_stages_missing_v2_archive_with_initialized_cwd
      - name: Install Playwright and Chromium for browser regressions
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pqm-playwright" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pqm-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run Appeals browser regressions on the checked-out revision
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pqm-playwright/node_modules
          PQM_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/pqm-chat-messages-evidence
          PQM_UO_EVIDENCE_DIR: ${{ runner.temp }}/pqm-uo-work-layout-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat ci-evidence/tested-sha.txt)"
          mkdir -p "$PQM_BROWSER_EVIDENCE_DIR"
          mkdir -p "$PQM_UO_EVIDENCE_DIR"
          node validation/appeals_justification_browser.cjs
          node validation/appeals_declension_card_browser.cjs
          node validation/protocol_names_card_browser.cjs
          node validation/chat_messages_browser.cjs
          node validation/google_writer_preview_modal_browser.cjs
          node validation/google_writer_apply_modal_layout_browser.cjs
          node validation/uo_work_page_layout_browser.cjs
      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag pqm-ci:tested . 2>&1 | tee ci-evidence/build.log
          docker image inspect pqm-ci:tested --format '{{.Id}}' > ci-evidence/image-id.txt
      - name: Run isolated container gate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python pqm-ci:tested \
            -B validation/docker_release_gate.py 2>&1 | tee ci-evidence/container-gate.log
      - name: Run AMCU polling regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node pqm-ci:tested \
            validation/amcu_poll_smoke.cjs 2>&1 | tee ci-evidence/amcu-ui.log
      - name: Run sandbox contrast regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node pqm-ci:tested \
            validation/sandbox_contrast_smoke.cjs 2>&1 | tee ci-evidence/sandbox-contrast.log
      - name: Run OAuth callback regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python \
            -e PYTHONPATH=/app/validation/test_runtime:/app \
            -e PQM_TEST_NETWORK_ISOLATION=1 \
            -e PQM_ENV=local -e HOST=127.0.0.1 -e PORT=8080 \
            -e PQM_AUTH_ENABLED=0 -e PQM_ENABLE_SCHEDULER=0 pqm-ci:tested \
            -B -m unittest test_google_oauth_hotfix -v 2>&1 | tee ci-evidence/oauth.log
      - name: Run permanent daily-sync regressions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node \
            -e PQM_PYTHON=python3 pqm-ci:tested \
            --test scripts/pqm-google-writer/sandbox-append-daily-cycle.test.cjs \
            scripts/pqm-google-writer/sandbox-controlled-apply.test.cjs \
            scripts/pqm-google-writer/sandbox-guard-profiler.test.cjs \
            scripts/pqm-google-writer/sandbox-preview-audit.test.cjs \
            scripts/pqm-google-writer/sandbox-full-apply.test.cjs \
            scripts/pqm-google-writer/sandbox-expanded-change-audit.test.cjs \
            2>&1 | tee ci-evidence/daily-sync.log
      - name: Run delivered regression suite
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v10-snapshot.zip,dst=/tmp/pqm-integrated-v10-snapshot.zip,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v11-snapshot.zip,dst=/tmp/pqm-integrated-v11-snapshot.zip,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v12-snapshot.zip,dst=/tmp/pqm-integrated-v12-snapshot.zip,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v13-snapshot.zip,dst=/tmp/pqm-integrated-v13-snapshot.zip,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v14-snapshot.zip,dst=/tmp/pqm-integrated-v14-snapshot.zip,readonly" \
            -e PQM_INTEGRATED_V10_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v10-snapshot.zip \
            -e PQM_INTEGRATED_V10_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V10_SNAPSHOT_ARCHIVE_SHA256" \
            -e PQM_INTEGRATED_V11_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v11-snapshot.zip \
            -e PQM_INTEGRATED_V11_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V11_SNAPSHOT_ARCHIVE_SHA256" \
            -e PQM_INTEGRATED_V12_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v12-snapshot.zip \
            -e PQM_INTEGRATED_V12_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V12_SNAPSHOT_ARCHIVE_SHA256" \
            -e PQM_INTEGRATED_V13_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v13-snapshot.zip \
            -e PQM_INTEGRATED_V13_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V13_SNAPSHOT_ARCHIVE_SHA256" \
            -e PQM_INTEGRATED_V14_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v14-snapshot.zip \
            -e PQM_INTEGRATED_V14_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V14_SNAPSHOT_ARCHIVE_SHA256" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v15-snapshot.zip,dst=/tmp/pqm-integrated-v15-snapshot.zip,readonly" \
            -e PQM_INTEGRATED_V15_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v15-snapshot.zip \
            -e PQM_INTEGRATED_V15_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V15_SNAPSHOT_ARCHIVE_SHA256" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v16-snapshot.zip,dst=/tmp/pqm-integrated-v16-snapshot.zip,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v17-snapshot.zip,dst=/tmp/pqm-integrated-v17-snapshot.zip,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pqm-integrated-v18-snapshot.zip,dst=/tmp/pqm-integrated-v18-snapshot.zip,readonly" \
            -e PQM_INTEGRATED_V16_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v16-snapshot.zip \
            -e PQM_INTEGRATED_V16_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V16_SNAPSHOT_ARCHIVE_SHA256" \
            -e PQM_INTEGRATED_V17_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v17-snapshot.zip \
            -e PQM_INTEGRATED_V17_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V17_SNAPSHOT_ARCHIVE_SHA256" \
            -e PQM_INTEGRATED_V18_SNAPSHOT_ARCHIVE=/tmp/pqm-integrated-v18-snapshot.zip \
            -e PQM_INTEGRATED_V18_SNAPSHOT_ARCHIVE_SHA256="$PQM_INTEGRATED_V18_SNAPSHOT_ARCHIVE_SHA256" \
            --entrypoint python pqm-ci:tested \
            -B validation/run_local_release.py 2>&1 | tee ci-evidence/regression.log
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pqm-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error
