name: PQM release checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pqm-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-gate:
    name: Container release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record tested revision
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD > ci-evidence/tested-sha.txt
          printf 'PR checks test the merge revision; promotion requires the final deployed SHA.\n' > ci-evidence/scope.txt
      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag pqm-ci:tested . 2>&1 | tee ci-evidence/build.log
          docker image inspect pqm-ci:tested --format '{{.Id}}' > ci-evidence/image-id.txt
      - name: Run isolated container gate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python pqm-ci:tested \
            -B validation/docker_release_gate.py 2>&1 | tee ci-evidence/container-gate.log
      - name: Production documents browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pqm-documents-playwright" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pqm-documents-playwright/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/pqm-documents-playwright/node_modules"
          export PQM_CHROMIUM_EXECUTABLE="$(node -p "require('playwright').chromium.executablePath()")"
          export PQM_UI001_EVIDENCE="$RUNNER_TEMP/pqm-production-ui001"
          export PQM_UI002_EVIDENCE="$RUNNER_TEMP/pqm-production-ui002"
          mkdir -p "$PQM_UI001_EVIDENCE" "$PQM_UI002_EVIDENCE" "$RUNNER_TEMP/pqm-production-mvs"
          cp index.html "$PQM_UI001_EVIDENCE/sandbox-index.html"
          cp index.html "$PQM_UI002_EVIDENCE/sandbox-index.html"
          cp index.html "$RUNNER_TEMP/pqm-production-mvs/sandbox-index.html"
          node --test validation/application_documents_ui.test.cjs validation/document_check_ui.test.cjs validation/document_partial_selection.test.cjs
          node validation/production_documents_browser.cjs
          node validation/production_document_results_browser.cjs
          node validation/production_csv_versions_browser.cjs
          PQM_TEST_BROWSER="$PQM_CHROMIUM_EXECUTABLE" node validation/production_edr_display_toasts_browser.cjs
          PQM_TEST_BROWSER="$PQM_CHROMIUM_EXECUTABLE" node validation/production_edr_apply_permissions_browser_v2.cjs
          docker run --rm --network none --entrypoint python \
            -v "$RUNNER_TEMP/pqm-production-mvs:/evidence" \
            -e PQM_SANDBOX=0 -e PQM_ENV=local -e PQM_DATA_DIR=/tmp/pqm-doc-fixture \
            -e PQM_DB_PATH=/tmp/pqm-doc-fixture/synthetic.sqlite3 -e PQM_RELEASE_SCHEMA_ONLY=1 \
            -e PQM_ENABLE_GOOGLE=0 -e PQM_ENABLE_SCHEDULER=0 \
            -e PQM_MVS_STATUS_EVIDENCE=/evidence/results.json pqm-ci:tested \
            -B -m unittest validation.test_mvs_parameter_analysis
          PQM_UI002_EVIDENCE="$RUNNER_TEMP/pqm-production-mvs" PQM_MVS_STATUS_EVIDENCE="$RUNNER_TEMP/pqm-production-mvs/results.json" node validation/production_mvs_status_browser.cjs
      - name: Run AMCU polling regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node pqm-ci:tested \
            validation/amcu_poll_smoke.cjs 2>&1 | tee ci-evidence/amcu-ui.log
      - name: Run sandbox contrast regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node pqm-ci:tested \
            validation/sandbox_contrast_smoke.cjs 2>&1 | tee ci-evidence/sandbox-contrast.log
      - name: Run OAuth callback regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python \
            -e PYTHONPATH=/app/validation/test_runtime:/app \
            -e PQM_TEST_NETWORK_ISOLATION=1 \
            -e PQM_ENV=local -e HOST=127.0.0.1 -e PORT=8080 \
            -e PQM_AUTH_ENABLED=0 -e PQM_ENABLE_SCHEDULER=0 pqm-ci:tested \
            -B -m unittest test_google_oauth_hotfix -v 2>&1 | tee ci-evidence/oauth.log
      - name: Run permanent daily-sync regressions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node \
            -e PQM_PYTHON=python3 pqm-ci:tested \
            --test scripts/pqm-google-writer/sandbox-append-daily-cycle.test.cjs \
            scripts/pqm-google-writer/sandbox-controlled-apply.test.cjs \
            scripts/pqm-google-writer/sandbox-guard-profiler.test.cjs \
            scripts/pqm-google-writer/sandbox-preview-audit.test.cjs \
            scripts/pqm-google-writer/sandbox-full-apply.test.cjs \
            scripts/pqm-google-writer/sandbox-expanded-change-audit.test.cjs \
            2>&1 | tee ci-evidence/daily-sync.log
      - name: Run delivered regression suite
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python pqm-ci:tested \
            -B validation/run_production_edr_release_v2.py 2>&1 | tee ci-evidence/regression.log
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pqm-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            ${{ runner.temp }}/pqm-production-ui001/
            ${{ runner.temp }}/pqm-production-ui002/
            ${{ runner.temp }}/pqm-production-mvs/
          retention-days: 14
          if-no-files-found: error
