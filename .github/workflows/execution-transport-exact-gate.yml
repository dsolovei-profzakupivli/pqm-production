          git('merge-base','--is-ancestor',BASE,SHA)
          assert not git('status','--porcelain'), 'STOP: dirty checkout'
          git('diff','--check',BASE,SHA)
          changed=git('diff','--name-only','-z',BASE,SHA).decode('utf-8').rstrip('\0').split('\0')
          assert sorted(changed)==ALLOWED, 'STOP: scope'
          assert not pathlib.Path('.github/workflows/execution-transport-exact-gate.yml').exists(), 'STOP: verification HEAD used'
          for path,expected in EXPECTED.items():
              assert hashlib.sha256(git('show',SHA+':'+path)).hexdigest()==expected, 'STOP: Git blob '+path
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==expected, 'STOP: checkout bytes '+path
              if path not in ALLOWED:
                  assert git('show',BASE+':'+path)==git('show',SHA+':'+path), 'STOP: preserved source '+path
          assert 'scripts/pqm-google-writer/fixture-preview.json' not in changed
          assert not git('status','--porcelain'), 'STOP: dirty verified checkout'
