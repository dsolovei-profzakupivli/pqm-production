services:
  - type: web
    name: pqm-production
    runtime: docker
    plan: starter
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: pqm-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PQM_DATA_DIR
        value: /var/data
      - key: PQM_AUTH_REALM
        value: PQM Production
      - key: PQM_USERS_JSON
        sync: false
      - key: PQM_GOOGLE_OAUTH_CLIENT
        sync: false
      - key: PQM_GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: PQM_GOOGLE_OAUTH_TOKEN
        value: /var/data/google_oauth/google_oauth_token.json
      - key: PQM_GOOGLE_OAUTH_DIR
        value: /var/data/google_oauth
      - key: PQM_BIDS_DB
        value: /var/data/prozorro_bids.db
      - key: PQM_BIDS_PROJECT
        value: /var/data/ProzorroBids
